<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="格價 App" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f766e" />
  <title>格價 App - 智能貨品格價助手</title>

  <!-- Dynamic PWA Manifest & App Icon via inline SVG Data URI -->
  <link id="pwa-manifest" rel="manifest" href="" />
  <link id="apple-touch-icon" rel="apple-touch-icon" href="" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Inter & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }

    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      margin: 0;
      padding: 0;
      overscroll-behavior-y: none;
    }

    /* Prevent iOS Safari auto-zoom on input focus (must be >= 16px) */
    input, select, textarea {
      font-size: 16px !important;
    }

    .safe-pt {
      padding-top: max(4px, var(--sat));
    }

    .safe-pb {
      padding-bottom: max(12px, var(--sab));
    }

    .app-container {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100dvh;
      background-color: #f8fafc;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 40px rgba(15, 23, 42, 0.08);
    }

    .screen-fade {
      animation: fadeIn 0.18s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Custom subtle scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
  </style>
</head>
<body>
  <div id="app" class="app-container">
    <!-- Persistent Top App Header -->
    <header class="sticky top-0 z-30 bg-teal-700 text-white shadow-md safe-pt">
      <div class="flex items-center justify-between px-3 py-1.5 min-h-[44px]">
        <!-- Back Button -->
        <div class="w-20 flex items-center">
          <button
            id="header-back-btn"
            onclick="goBack()"
            class="hidden items-center gap-1 px-2.5 py-1.5 rounded-xl bg-teal-800/70 hover:bg-teal-800 active:scale-95 transition text-sm font-medium text-white"
            aria-label="返回"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
            </svg>
            <span>返回</span>
          </button>
        </div>

        <!-- Dynamic Screen Title -->
        <div class="flex-1 text-center px-1 truncate">
          <h1 id="header-title" class="text-base sm:text-lg font-bold tracking-tight truncate">
            格價 App
          </h1>
          <p id="header-subtitle" class="text-[11px] text-teal-100 leading-none mt-0.5 hidden truncate"></p>
        </div>

        <!-- Quick Home Button -->
        <div class="w-20 flex items-center justify-end">
          <button
            id="header-home-btn"
            onclick="navigate('home')"
            class="p-1.5 rounded-xl bg-teal-800/60 hover:bg-teal-800 active:scale-95 transition text-white"
            aria-label="首頁 Home"
            title="首頁 Home"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Scrollable Content Area -->
    <main id="main-content" class="flex-1 overflow-y-auto px-4 pt-4 pb-28">
      <!-- Dynamic Screen Content Injected Here -->
    </main>

    <!-- Floating Action Button (FAB) Container -->
    <div id="fab-container" class="fixed bottom-20 left-0 right-0 z-20 pointer-events-none">
      <div class="max-w-[480px] mx-auto px-4 flex justify-end">
        <!-- FAB Button rendered dynamically when applicable -->
      </div>
    </div>

    <!-- Bottom Navigation Bar (4 Tabs for one-handed use) -->
    <nav class="sticky bottom-0 z-30 bg-white border-t border-slate-200 safe-pb shadow-[0_-4px_12px_rgba(15,23,42,0.04)]">
      <div class="grid grid-cols-4 h-16">
        <button
          onclick="navigate('home')"
          data-tab="home"
          class="nav-tab flex flex-col items-center justify-center gap-1 text-slate-500 hover:text-teal-700 transition"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
          </svg>
          <span class="text-[11px] font-medium">首頁 Home</span>
        </button>

        <button
          onclick="navigate('shop-list')"
          data-tab="shop"
          class="nav-tab flex flex-col items-center justify-center gap-1 text-slate-500 hover:text-teal-700 transition"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
          </svg>
          <span class="text-[11px] font-medium">商店 Shop</span>
        </button>

        <button
          onclick="navigate('item-list')"
          data-tab="item"
          class="nav-tab flex flex-col items-center justify-center gap-1 text-slate-500 hover:text-teal-700 transition"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
          </svg>
          <span class="text-[11px] font-medium">貨品 Item</span>
        </button>

        <button
          onclick="navigate('import-export')"
          data-tab="import-export"
          class="nav-tab flex flex-col items-center justify-center gap-1 text-slate-500 hover:text-teal-700 transition"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
          </svg>
          <span class="text-[11px] font-medium">匯入/匯出</span>
        </button>
      </div>
    </nav>

    <!-- Custom Modal Dialog (Replaces alert() and confirm()) -->
    <div id="custom-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/50 backdrop-blur-xs p-4">
      <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl border border-slate-100 transform transition-all">
        <div class="flex items-start gap-3">
          <div id="modal-icon" class="w-10 h-10 rounded-full flex items-center justify-center shrink-0 bg-amber-100 text-amber-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
          </div>
          <div class="flex-1">
            <h3 id="modal-title" class="text-base font-bold text-slate-900">確認操作</h3>
            <p id="modal-message" class="text-sm text-slate-600 mt-1.5 leading-relaxed"></p>
          </div>
        </div>
        <div id="modal-actions" class="mt-5 flex items-center justify-end gap-2.5">
          <button
            id="modal-cancel-btn"
            class="px-4 py-2.5 rounded-xl text-sm font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 active:scale-95 transition"
          >
            取消 Cancel
          </button>
          <button
            id="modal-confirm-btn"
            class="px-4 py-2.5 rounded-xl text-sm font-semibold text-white bg-teal-600 hover:bg-teal-700 active:scale-95 transition"
          >
            確定 Confirm
          </button>
        </div>
      </div>
    </div>

    <!-- Toast Notification Banner -->
    <div id="toast" class="fixed top-16 left-0 right-0 z-50 pointer-events-none flex justify-center px-4 opacity-0 transition-opacity duration-200">
      <div id="toast-inner" class="bg-slate-900/95 text-white text-sm font-medium px-4 py-2.5 rounded-full shadow-lg flex items-center gap-2 max-w-md">
        <span id="toast-icon">✅</span>
        <span id="toast-text">已儲存</span>
      </div>
    </div>
  </div>

  <script>
    /**
     * ============================================================================
     * PWA MANIFEST & APP ICON SETUP (Allows Add to Home Screen on iOS & Android)
     * ============================================================================
     */
    (function setupPWA() {
      try {
        const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
          <rect width="512" height="512" rx="112" fill="#0f766e"/>
          <path d="M140 160h130l110 110-130 130-110-110V160z" fill="#ffffff"/>
          <circle cx="195" cy="215" r="22" fill="#0f766e"/>
          <text x="256" y="455" font-family="sans-serif" font-size="68" font-weight="bold" fill="#ccfbf1" text-anchor="middle">格價</text>
        </svg>`;
        const iconUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(iconSvg);
        document.getElementById('apple-touch-icon').setAttribute('href', iconUrl);

        const manifest = {
          name: '格價 App - 智能貨品格價',
          short_name: '格價 App',
          description: '輕鬆比較不同商店與包裝規格的貨品平均單價，找出最抵價！',
          start_url: '.',
          display: 'standalone',
          background_color: '#f8fafc',
          theme_color: '#0f766e',
          icons: [
            {
              src: iconUrl,
              sizes: '512x512',
              type: 'image/svg+xml',
              purpose: 'any maskable'
            }
          ]
        };
        const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
        const manifestUrl = URL.createObjectURL(manifestBlob);
        document.getElementById('pwa-manifest').setAttribute('href', manifestUrl);
      } catch (e) {
        console.warn('PWA setup fallback:', e);
      }
    })();

    /**
     * ============================================================================
     * DATA STORE & INITIAL SAMPLE DATA (localStorage Persistence)
     * ============================================================================
     */
    const STORAGE_KEY = 'price_comparison_app_data_v1';
    const CONTACT_FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSeE4JjIUKVYS5yvHVtsjC8pCuUKNSCICl3SkcrhQTRR5E0FlA/viewform?usp=publish-editor';

    const DEFAULT_DATA = {
      shops: [
        { id: 'shop_1', name: 'Wellcome' },
        { id: 'shop_2', name: 'Parkin' }
      ],
      items: [
        { id: 'item_1', name: 'Green tea powder', unit: 'g' },
        { id: 'item_2', name: 'Coffee bean', unit: 'g' }
      ],
      prices: [
        {
          id: 'price_1',
          itemId: 'item_1',
          shopName: 'Wellcome',
          qtyPerItem: 250,
          totalItems: 4,
          totalPrice: 18
        },
        {
          id: 'price_2',
          itemId: 'item_1',
          shopName: 'Parkin',
          qtyPerItem: 500,
          totalItems: 1,
          totalPrice: 10
        }
      ]
    };

    let appData = {
      shops: [],
      items: [],
      prices: []
    };

    // UI & Navigation State
    let navStack = [{ screen: 'home', params: {} }];
    let showInstallGuide = false;
    let itemSearchQuery = '';
    let shopSearchQuery = '';
    let shopSortOrder = 'asc'; // 'asc' | 'desc'
    let priceSortBy = 'avgPrice'; // 'avgPrice' | 'shop'
    let priceShopSearchQuery = '';
    let lastSelectedShopName = '';

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          appData = JSON.parse(JSON.stringify(DEFAULT_DATA));
          saveData();
        } else {
          const parsed = JSON.parse(raw);
          appData = {
            shops: Array.isArray(parsed.shops) ? parsed.shops : [],
            items: Array.isArray(parsed.items) ? parsed.items : [],
            prices: Array.isArray(parsed.prices) ? parsed.prices : []
          };
        }
      } catch (err) {
        console.error('Error loading localStorage:', err);
        appData = JSON.parse(JSON.stringify(DEFAULT_DATA));
      }
    }

    function saveData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
      } catch (err) {
        console.error('Error saving to localStorage:', err);
        showToast('儲存失敗，請檢查瀏覽器儲存空間', '⚠️');
      }
    }

    function generateId(prefix) {
      return `${prefix}_${Date.now()}_${Math.random().toString(36).substring(2, 7)}`;
    }

    /**
     * ============================================================================
     * CALCULATION HELPERS (Matching Functional Specification Exact Formula)
     * ============================================================================
     */
    function calcAvgPrice(totalPrice, qtyPerItem, totalItems) {
      const denom = Number(qtyPerItem) * Number(totalItems);
      if (!denom || denom <= 0 || isNaN(denom)) return 0;
      const val = Number(totalPrice) / denom;
      return isNaN(val) ? 0 : val;
    }

    function formatNumber(num, maxDecimals = 4) {
      if (num === null || num === undefined || isNaN(num)) return '0';
      // Format cleanly up to maxDecimals without trailing zeros
      const fixed = Number(num).toFixed(maxDecimals);
      return parseFloat(fixed).toString();
    }

    function formatTimestamp(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return '';
      const pad = (n) => String(n).padStart(2, '0');
      const yyyy = d.getFullYear();
      const mm = pad(d.getMonth() + 1);
      const dd = pad(d.getDate());
      const hh = pad(d.getHours());
      const min = pad(d.getMinutes());
      const ss = pad(d.getSeconds());
      return `${yyyy}-${mm}-${dd} ${hh}:${min}:${ss}`;
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    /**
     * ============================================================================
     * UI FEEDBACK: CUSTOM DIALOG & TOAST (Zero native alert/confirm)
     * ============================================================================
     */
    let toastTimer = null;
    function showToast(message, icon = '✅') {
      const toastEl = document.getElementById('toast');
      document.getElementById('toast-text').textContent = message;
      document.getElementById('toast-icon').textContent = icon;
      toastEl.classList.remove('opacity-0');
      toastEl.classList.add('opacity-100');

      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastEl.classList.remove('opacity-100');
        toastEl.classList.add('opacity-0');
      }, 2400);
    }

    function showModal({ title, message, confirmText = '確定 Confirm', cancelText = '取消 Cancel', isDanger = false, showCancel = true, onConfirm }) {
      const modal = document.getElementById('custom-modal');
      const titleEl = document.getElementById('modal-title');
      const msgEl = document.getElementById('modal-message');
      const confirmBtn = document.getElementById('modal-confirm-btn');
      const cancelBtn = document.getElementById('modal-cancel-btn');
      const iconWrap = document.getElementById('modal-icon');

      titleEl.textContent = title;
      msgEl.textContent = message;
      confirmBtn.textContent = confirmText;
      cancelBtn.textContent = cancelText;

      if (showCancel) {
        cancelBtn.classList.remove('hidden');
      } else {
        cancelBtn.classList.add('hidden');
      }

      if (isDanger) {
        confirmBtn.className = 'px-4 py-2.5 rounded-xl text-sm font-semibold text-white bg-rose-600 hover:bg-rose-700 active:scale-95 transition';
        iconWrap.className = 'w-10 h-10 rounded-full flex items-center justify-center shrink-0 bg-rose-100 text-rose-600';
      } else {
        confirmBtn.className = 'px-4 py-2.5 rounded-xl text-sm font-semibold text-white bg-teal-600 hover:bg-teal-700 active:scale-95 transition';
        iconWrap.className = 'w-10 h-10 rounded-full flex items-center justify-center shrink-0 bg-amber-100 text-amber-600';
      }

      modal.classList.remove('hidden');
      modal.classList.add('flex');

      const closeModal = () => {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      };

      cancelBtn.onclick = closeModal;
      confirmBtn.onclick = () => {
        closeModal();
        if (typeof onConfirm === 'function') onConfirm();
      };
    }

    /**
     * ============================================================================
     * NAVIGATION CONTROLLER
     * ============================================================================
     */
    function currentRoute() {
      return navStack[navStack.length - 1];
    }

    function navigate(screen, params = {}, replace = false) {
      if (screen === 'home') {
        navStack = [{ screen: 'home', params: {} }];
      } else if (replace) {
        navStack[navStack.length - 1] = { screen, params };
      } else {
        navStack.push({ screen, params });
      }
      render();
      document.getElementById('main-content').scrollTop = 0;
    }

    function goBack() {
      if (navStack.length > 1) {
        navStack.pop();
        render();
      } else {
        navigate('home');
      }
    }

    function updateNavigationChrome(screen, title, subtitle = '') {
      const backBtn = document.getElementById('header-back-btn');
      const homeBtn = document.getElementById('header-home-btn');
      const titleEl = document.getElementById('header-title');
      const subtitleEl = document.getElementById('header-subtitle');

      titleEl.textContent = title;
      if (subtitle) {
        subtitleEl.textContent = subtitle;
        subtitleEl.classList.remove('hidden');
      } else {
        subtitleEl.classList.add('hidden');
      }

      if (screen === 'home' || navStack.length <= 1) {
        backBtn.classList.add('hidden');
        backBtn.classList.remove('flex');
      } else {
        backBtn.classList.remove('hidden');
        backBtn.classList.add('flex');
      }

      if (screen === 'home') {
        homeBtn.classList.add('opacity-40', 'pointer-events-none');
      } else {
        homeBtn.classList.remove('opacity-40', 'pointer-events-none');
      }

      // Highlight active bottom tab
      let activeTab = 'home';
      if (screen.startsWith('shop')) activeTab = 'shop';
      else if (screen.startsWith('item') || screen.startsWith('price')) activeTab = 'item';
      else if (screen === 'import-export') activeTab = 'import-export';

      document.querySelectorAll('.nav-tab').forEach(btn => {
        const isMatch = btn.getAttribute('data-tab') === activeTab;
        if (isMatch) {
          btn.classList.remove('text-slate-500');
          btn.classList.add('text-teal-700', 'font-bold');
        } else {
          btn.classList.add('text-slate-500');
          btn.classList.remove('text-teal-700', 'font-bold');
        }
      });
    }

    function setFAB(html) {
      const container = document.querySelector('#fab-container > div');
      container.innerHTML = html || '';
    }

    /**
     * ============================================================================
     * SCREEN RENDERERS (All 8 Screens from Specification)
     * ============================================================================
     */
    function resetScrollPositions() {
      const main = document.getElementById('main-content');
      if (main) main.scrollTop = 0;
      window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
      document.documentElement.scrollTop = 0;
      document.body.scrollTop = 0;
    }

    function render() {
      const route = currentRoute();
      const main = document.getElementById('main-content');
      setFAB('');

      switch (route.screen) {
        case 'home':
          renderHome(main);
          break;
        case 'shop-list':
          renderShopList(main);
          break;
        case 'shop-edit':
          renderShopEdit(main, route.params);
          break;
        case 'item-list':
          renderItemList(main);
          break;
        case 'item-edit':
          renderItemEdit(main, route.params);
          break;
        case 'price-list':
          renderPriceList(main, route.params);
          break;
        case 'price-edit':
          renderPriceEdit(main, route.params);
          break;
        case 'import-export':
          renderImportExport(main);
          break;
        default:
          renderHome(main);
      }
      resetScrollPositions();
      requestAnimationFrame(() => {
        resetScrollPositions();
      });
    }

    /**
     * ----------------------------------------------------------------------------
     * SCREEN 1: HOME (首頁)
     * ----------------------------------------------------------------------------
     */
    function renderHome(container) {
      updateNavigationChrome('home', '格價 App', 'Price Comparison');

      const shopCount = appData.shops.length;
      const itemCount = appData.items.length;
      const priceCount = appData.prices.length;

      container.innerHTML = `
        <div class="screen-fade space-y-4">
          <!-- Hero Summary Card -->
          <div class="bg-gradient-to-br from-teal-700 via-teal-600 to-emerald-600 rounded-2xl p-5 text-white shadow-md">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-teal-100 text-xs font-medium uppercase tracking-wider">Smart Shopping Assistant</p>
                <h2 class="text-xl font-bold mt-1">精明格價，一眼睇晒</h2>
                <p class="text-teal-50 text-xs mt-1">自動計算每單位平均價，即時找出最抵買商店 👍</p>
              </div>

    function getSortedFilteredShops() {
      const q = (shopSearchQuery || '').trim().toLowerCase();
      let list = q
        ? appData.shops.filter(shop => (shop.name || '').toLowerCase().includes(q))
        : [...appData.shops];

      if (shopSortOrder === 'desc') {
        list.sort((a, b) => (b.name || '').localeCompare(a.name || '', undefined, { sensitivity: 'base', numeric: true }));
      } else {
        list.sort((a, b) => (a.name || '').localeCompare(b.name || '', undefined, { sensitivity: 'base', numeric: true }));
      }

      return list;
    }

    function renderShopEdit(container, params = {}) {
      const isEdit = params.mode === 'edit' && params.shopId;
      const existingShop = isEdit ? appData.shops.find(s => s.id === params.shopId) : null;

      updateNavigationChrome(
        'shop-edit',
        isEdit ? '編輯商店 Shop Edit' : '新增商店 New Shop',
        isEdit ? existingShop?.name : '建立新商店'
      );

      container.innerHTML = `
        <div class="screen-fade space-y-4">
          <form id="shop-form" onsubmit="handleSaveShop(event, '${isEdit ? existingShop.id : ''}')" class="bg-white rounded-2xl p-5 shadow-2xs border border-slate-200/80 space-y-4">

              <label for="shop-name-input" class="block text-sm font-bold text-slate-800 mb-1.5">

                required

                class="w-full py-3.5 px-4 rounded-xl bg-teal-600 hover:bg-teal-700 active:scale-[0.99] text-white font-bold text-base shadow-sm transition"
              >
                儲存 Save
              </button>

              ${isEdit ? `
                <button
                  type="button"
                  onclick="handleDeleteShop('${existingShop.id}')"
                  class="w-full py-3 px-4 rounded-xl bg-rose-50 hover:bg-rose-100 active:scale-[0.99] text-rose-600 font-bold text-sm transition"
                >
                  刪除商店 Delete Shop
                </button>
              ` : ''}
            </div>
          </form>
        </div>
      `;

      setTimeout(() => {
        const input = document.getElementById('shop-name-input');
        if (input && !isEdit) input.focus();
      }, 80);
    }

    function handleSaveShop(e, shopId) {
      e.preventDefault();
      const input = document.getElementById('shop-name-input');
      const errEl = document.getElementById('shop-error');
      const name = input.value.trim();

      if (!name) {
        errEl.textContent = '請輸入商店名稱 (Shop Name 不能為空)';
        errEl.classList.remove('hidden');
        input.focus();
        return;
      }

      // Check duplicate shop name (case-insensitive)
      const duplicate = appData.shops.find(
        s => s.name.toLowerCase() === name.toLowerCase() && s.id !== shopId
      );
      if (duplicate) {
        errEl.textContent = '此商店名稱已存在，請使用其他名稱';
        errEl.classList.remove('hidden');
        input.focus();
        return;
      }

      const nowIso = new Date().toISOString();
      if (shopId) {
        const target = appData.shops.find(s => s.id === shopId);
        if (target) {
          const oldName = target.name;
          target.name = name;
          target.updatedAt = nowIso;
          // Cascade rename to associated price records
          appData.prices.forEach(p => {
            if (p.shopName === oldName) {
              p.shopName = name;
            }
          });
        }
        showToast('商店資料已更新', '✅');
      } else {
        appData.shops.push({
          id: generateId('shop'),
          name,
          updatedAt: nowIso
        });
        showToast('已新增商店', '✅');
      }

      saveData();
      goBack();
    }

    function handleDeleteShop(shopId) {
      const target = appData.shops.find(s => s.id === shopId);
      if (!target) return;

      const linkedCount = appData.prices.filter(p => p.shopName === target.name).length;
      const extraMsg = linkedCount > 0
        ? `（注意：此商店目前有 ${linkedCount} 筆格價紀錄，刪除商店不會自動刪除該格價紀錄）`
        : '';

      showModal({
        title: '刪除商店 Delete Shop',
        message: `確定要刪除「${target.name}」嗎？${extraMsg}`,
        confirmText: '確定刪除',
        isDanger: true,
        onConfirm: () => {
          appData.shops = appData.shops.filter(s => s.id !== shopId);
          saveData();
          showToast('已刪除商店', '🗑️');
          goBack();
        }
      });
    }

    function handleSaveItem(e, itemId) {
      e.preventDefault();
      const nameInput = document.getElementById('item-name-input');
      const unitInput = document.getElementById('item-unit-input');
      const errEl = document.getElementById('item-error');

      const name = nameInput.value.trim();
      const unit = unitInput.value.trim();

      if (!name || !unit) {
        errEl.textContent = '請填寫「貨品名稱」及「Unit 單位」';
        errEl.classList.remove('hidden');
        return;
      }

      const nowIso = new Date().toISOString();
      if (itemId) {
        const target = appData.items.find(i => i.id === itemId);
        if (target) {
          target.name = name;
          target.unit = unit;
          target.updatedAt = nowIso;
        }
        saveData();
        showToast('貨品資料已更新', '✅');
        goBack();
      } else {
        const newItem = {
          id: generateId('item'),
          name,
          unit,
          updatedAt: nowIso
        };
        appData.items.push(newItem);
        saveData();
        showToast('已新增貨品', '✅');
        // Replace item-edit with price-list for immediate price entry convenience
        navigate('price-list', { itemId: newItem.id }, true);
      }
    }

    function handleDeleteItem(itemId) {
      const target = appData.items.find(i => i.id === itemId);
      if (!target) return;

      const priceCount = appData.prices.filter(p => p.itemId === itemId).length;
      showModal({
        title: '刪除貨品 Delete Item',
        message: `確定要刪除「${target.name}」嗎？相關的 ${priceCount} 筆格價紀錄亦會一併刪除。`,
        confirmText: '確定刪除',
        isDanger: true,
        onConfirm: () => {
          appData.items = appData.items.filter(i => i.id !== itemId);
          appData.prices = appData.prices.filter(p => p.itemId !== itemId);
          saveData();
          showToast('已刪除貨品', '🗑️');
          navigate('item-list');
        }
      });
    }

    function handlePriceShopSearchInput(val, itemId) {
      priceShopSearchQuery = val || '';

        }
      }
      const resultsEl = document.getElementById('price-list-results');

      if (resultsEl && item) {
        const computed = getComputedItemPrices(item);

    function clearPriceShopSearch(itemId) {
      priceShopSearchQuery = '';
      const input = document.getElementById('price-shop-search-input');
      if (input) {
        input.value = '';
        input.focus();
      }
      handlePriceShopSearchInput('', itemId);
    }

    function getComputedItemPrices(item) {
      const itemPrices = appData.prices.filter(p => p.itemId === item.id);

      let minAvg = Infinity;
      const enrichedPrices = itemPrices.map(p => {
        const avgPrice = calcAvgPrice(p.totalPrice, p.qtyPerItem, p.totalItems);
        if (avgPrice < minAvg) {
          minAvg = avgPrice;
        }
        return { ...p, avgPrice };
      });

      const avgPriceSorted = [...enrichedPrices].sort((a, b) => {
        const priceDiff = a.avgPrice - b.avgPrice;
        if (Math.abs(priceDiff) > 1e-9) return priceDiff;
        return (a.shopName || '').localeCompare(b.shopName || '', undefined, { sensitivity: 'base' });
      });

      avgPriceSorted.forEach((rec, idx) => {
        if (idx === 0) {
          rec.avgRank = 1;
        } else {
          const prev = avgPriceSorted[idx - 1];
          rec.avgRank = Math.abs(rec.avgPrice - prev.avgPrice) <= 1e-9 ? prev.avgRank : idx + 1;
        }
      });

      const q = (priceShopSearchQuery || '').trim().toLowerCase();
      const filteredSorted = q
        ? enrichedPrices.filter(p => (p.shopName || '').toLowerCase().includes(q))
        : [...enrichedPrices];

      filteredSorted.sort((a, b) => {
        if (priceSortBy === 'shop') {
          const shopCmp = (a.shopName || '').localeCompare(b.shopName || '', undefined, { sensitivity: 'base' });
          if (shopCmp !== 0) return shopCmp;
          return a.avgPrice - b.avgPrice;
        }
        const priceDiff = a.avgPrice - b.avgPrice;
        if (Math.abs(priceDiff) > 1e-9) return priceDiff;
        return (a.shopName || '').localeCompare(b.shopName || '', undefined, { sensitivity: 'base' });
      });

      return {
        totalCount: enrichedPrices.length,
        minAvg,
        filteredSorted
      };
    }

    function updateLivePricePreview(unit) {
      const qty = parseFloat(document.getElementById('price-qty-input')?.value);
      const items = parseFloat(document.getElementById('price-items-input')?.value);
      const total = parseFloat(document.getElementById('price-total-input')?.value);
      const displayEl = document.getElementById('live-avg-value');

      if (!displayEl) return;

      if (qty > 0 && items > 0 && total >= 0) {
        const avg = calcAvgPrice(total, qty, items);
        displayEl.textContent = `$${formatNumber(avg, 4)}`;
      } else {
        displayEl.textContent = '$0';
      }
    }

    function handleSavePrice(e, itemId, priceId) {
      e.preventDefault();
      const shopName = document.getElementById('price-shop-select').value;
      const qtyPerItem = parseFloat(document.getElementById('price-qty-input').value);
      const totalItems = parseFloat(document.getElementById('price-items-input').value);
      const totalPrice = parseFloat(document.getElementById('price-total-input').value);
      const errEl = document.getElementById('price-error');

      if (!shopName) {
        errEl.textContent = '請選擇商店 (Shop Name)';
        errEl.classList.remove('hidden');
        return;
      }
      if (isNaN(qtyPerItem) || qtyPerItem <= 0) {
        errEl.textContent = '請輸入大於 0 的「每件數量 (Qty per item)」';
        errEl.classList.remove('hidden');
        return;
      }
      if (isNaN(totalItems) || totalItems <= 0) {
        errEl.textContent = '請輸入大於 0 的「總件數 (Total items)」';
        errEl.classList.remove('hidden');
        return;
      }
      if (isNaN(totalPrice) || totalPrice < 0) {
        errEl.textContent = '請輸入有效的「總價 (Total Price)」';
        errEl.classList.remove('hidden');
        return;
      }

      lastSelectedShopName = shopName;
      const nowIso = new Date().toISOString();
      if (priceId) {
        const target = appData.prices.find(p => p.id === priceId);
        if (target) {
          target.shopName = shopName;
          target.qtyPerItem = qtyPerItem;
          target.totalItems = totalItems;
          target.totalPrice = totalPrice;
          target.updatedAt = nowIso;
        }
        showToast('格價紀錄已更新', '✅');
      } else {
        appData.prices.push({
          id: generateId('price'),
          itemId,
          shopName,
          qtyPerItem,
          totalItems,
          totalPrice,
          updatedAt: nowIso
        });
        showToast('已新增格價紀錄', '✅');
      }

      saveData();
      goBack();
    }

    /**
     * ----------------------------------------------------------------------------
     * SCREEN 8: IMPORT / EXPORT (資料匯入 / 匯出 - Tab-delimited CSV/TSV)
     * ----------------------------------------------------------------------------
     */
    function generateTabDelimitedExport() {
      // Structured Tab-delimited format supporting Shops, Items, and Prices cleanly
      const lines = [];
      lines.push(['RECORD_TYPE', 'SHOP_NAME', 'ITEM_NAME', 'UNIT', 'QTY_PER_ITEM', 'TOTAL_ITEMS', 'TOTAL_PRICE', 'AVG_PRICE_PER_QTY', 'UPDATED_AT'].join('\t'));

      appData.shops.forEach(s => {
        lines.push(['SHOP', s.name, '', '', '', '', '', '', s.updatedAt || ''].join('\t'));
      });

      appData.items.forEach(i => {
        lines.push(['ITEM', '', i.name, i.unit, '', '', '', '', i.updatedAt || ''].join('\t'));
      });

      appData.prices.forEach(p => {
        const item = appData.items.find(i => i.id === p.itemId);
        const itemName = item ? item.name : 'Unknown';
        const unit = item ? item.unit : '';
        const avg = formatNumber(calcAvgPrice(p.totalPrice, p.qtyPerItem, p.totalItems), 4);
        lines.push([
          'PRICE',
          p.shopName,
          itemName,
          unit,
          p.qtyPerItem,
          p.totalItems,
          p.totalPrice,
          avg,
          p.updatedAt || ''
        ].join('\t'));
      });

      return lines.join('\n');
    }

    function handleExportDownload() {
      try {
        const tsvContent = generateTabDelimitedExport();
        // Add UTF-8 BOM so Excel / Numbers on iPhone & Windows opens Traditional Chinese cleanly
        const blob = new Blob(['\uFEFF' + tsvContent], { type: 'text/tab-separated-values;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        const dateStr = new Date().toISOString().slice(0, 10);
        link.href = url;
        link.download = `price_comparison_${dateStr}.csv`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        showToast('已匯出 Tab-delimited 檔案', '📥');
      } catch (err) {
        console.error('Export error:', err);
        showToast('匯出失敗，請使用複製功能', '⚠️');
      }
    }

    function handleCopyExport() {
      const textarea = document.getElementById('export-preview-box');
      if (!textarea) return;
      textarea.select();
      textarea.setSelectionRange(0, 99999);
      try {
        document.execCommand('copy');
        showToast('已複製所有資料到剪貼簿', '📋');
      } catch (err) {
        showToast('複製失敗，請手動全選複製', '⚠️');
      }
    }

    function handleFileSelected(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const text = e.target?.result || '';
        const pasteBox = document.getElementById('import-paste-box');
        if (pasteBox) {
          pasteBox.value = text;
          showToast('已讀取檔案內容，請點擊「開始匯入」', '📄');
        }
      };
      reader.readAsText(file, 'UTF-8');
    }

    function triggerImportConfirm() {
      const rawText = document.getElementById('import-paste-box')?.value?.trim();
      if (!rawText) {
        showToast('請先選擇檔案或貼上匯入內容', '⚠️');
        return;
      }

      showModal({
        title: '確認匯入資料 Confirm Import',
        message: '匯入將會清空現有所有資料並載入新資料 (Clean up all records in this App and import records from Tab-delimited file)。確定繼續嗎？',
        confirmText: '確定清空並匯入',
        isDanger: true,
        onConfirm: () => {
          executeTabDelimitedImport(rawText);
        }
      });
    }

    function executeTabDelimitedImport(rawText) {
      try {
        // Strip optional UTF-8 BOM
        const cleanText = rawText.replace(/^\uFEFF/, '');
        const lines = cleanText.split(/\r?\n/).map(l => l.trim()).filter(Boolean);

        const newShops = [];
        const newItems = [];
        const newPrices = [];

        const parseUpdatedAt = (rawVal) => {
          const s = (rawVal || '').trim();
          if (!s) return new Date().toISOString();
          const d = new Date(s);
          return isNaN(d.getTime()) ? new Date().toISOString() : d.toISOString();
        };

        const ensureShop = (shopName, updatedAtVal) => {
          const clean = (shopName || '').trim();
          if (!clean) return;
          if (!newShops.some(s => s.name.toLowerCase() === clean.toLowerCase())) {
            newShops.push({ id: generateId('shop'), name: clean, updatedAt: parseUpdatedAt(updatedAtVal) });
          }
        };

        const ensureItem = (itemName, unit, updatedAtVal) => {
          const cleanName = (itemName || '').trim();
          const cleanUnit = (unit || 'pcs').trim();
          if (!cleanName) return null;
          let found = newItems.find(i => i.name.toLowerCase() === cleanName.toLowerCase());
          if (!found) {
            found = { id: generateId('item'), name: cleanName, unit: cleanUnit || 'pcs', updatedAt: parseUpdatedAt(updatedAtVal) };
            newItems.push(found);
          }
          return found;
        };

        lines.forEach((line, idx) => {
          const cols = line.split('\t');
          const firstCol = (cols[0] || '').trim().toUpperCase();

          // Skip header row
          if (idx === 0 && (firstCol === 'RECORD_TYPE' || firstCol === 'SHOP_NAME' || firstCol === 'SHOP')) {
            if (cols[1] && cols[1].toUpperCase() === 'SHOP_NAME') return;
            if (firstCol === 'RECORD_TYPE') return;
          }

          if (firstCol === 'SHOP') {
            ensureShop(cols[1], cols[8]);
          } else if (firstCol === 'ITEM') {
            ensureItem(cols[2], cols[3], cols[8]);
          } else if (firstCol === 'PRICE') {
            const shopName = (cols[1] || '').trim();
            const itemName = (cols[2] || '').trim();
            const unit = (cols[3] || 'pcs').trim();
            const qtyPerItem = parseFloat(cols[4]);
            const totalItems = parseFloat(cols[5]);
            const totalPrice = parseFloat(cols[6]);
            const updatedAt = parseUpdatedAt(cols[8]);

            if (shopName && itemName && qtyPerItem > 0 && totalItems > 0 && !isNaN(totalPrice)) {
              ensureShop(shopName, updatedAt);
              const itemObj = ensureItem(itemName, unit, updatedAt);
              if (itemObj) {
                newPrices.push({
                  id: generateId('price'),
                  itemId: itemObj.id,
                  shopName,
                  qtyPerItem,
                  totalItems,
                  totalPrice,
                  updatedAt
                });
              }
            }
          } else {
            // Also support flat 6-column Tab-delimited rows:
            // [Shop Name, Item Name, Unit, Qty per item, Total items, Total Price]
            const shopName = (cols[0] || '').trim();
            const itemName = (cols[1] || '').trim();
            const unit = (cols[2] || 'pcs').trim();
            const qtyPerItem = parseFloat(cols[3]);
            const totalItems = parseFloat(cols[4]);
            const totalPrice = parseFloat(cols[5]);
            const updatedAt = parseUpdatedAt(cols[6]);

            if (shopName && itemName && qtyPerItem > 0 && totalItems > 0 && !isNaN(totalPrice)) {
              ensureShop(shopName, updatedAt);
              const itemObj = ensureItem(itemName, unit, updatedAt);
              if (itemObj) {
                newPrices.push({
                  id: generateId('price'),
                  itemId: itemObj.id,
                  shopName,
                  qtyPerItem,
                  totalItems,
                  totalPrice,
                  updatedAt
                });
              }
            }
          }
        });

        if (newShops.length === 0 && newItems.length === 0 && newPrices.length === 0) {
          showToast('未能識別有效資料，請檢查 Tab 分隔格式', '⚠️');
          return;
        }

        // Clean up all existing records and replace with imported data
        appData = {
          shops: newShops,
          items: newItems,
          prices: newPrices
        };
        saveData();
        showToast(`成功匯入 ${newShops.length} 商店, ${newItems.length} 貨品, ${newPrices.length} 格價`, '✅');
        render();
      } catch (err) {
        console.error('Import parse error:', err);
        showToast('匯入時發生錯誤，請檢查檔案格式', '⚠️');
      }
    }

    function handleResetDefaultData() {
      showModal({
        title: '重設為範例資料',
        message: '這將會清除現有紀錄並還原預設的 Wellcome / Parkin 與 Green tea powder 範例資料，確定繼續嗎？',
        confirmText: '確定重設',
        isDanger: true,
        onConfirm: () => {
          appData = JSON.parse(JSON.stringify(DEFAULT_DATA));
          saveData();
          showToast('已還原預設範例資料', '✅');
          render();
        }
      });
    }

    /**
     * ============================================================================
     * APP INITIALIZATION
     * ============================================================================
     */
    window.addEventListener('DOMContentLoaded', () => {
      loadData();
      render();
    });
  </script>
</body>
</html>
